- name: Deploy the ruby compile farm
  hosts: all
  roles:
    - role: nerab.ruby
      vars:
        ruby_version:
          major: 4
          minor: 0
          teeny: 1
      become: true
      tags: [ ruby ]
    - role: suhlig.foundation.minimal
      become: true
      tags: [ suhlig ]
    - role: suhlig.foundation.local_user
      vars:
        local_user:
          name: suhlig
          comment: Steffen Uhlig
          github_user: suhlig
      become: true
      tags: [ suhlig, user ]
    - role: geerlingguy.docker
      vars: { docker_users: [ suhlig ] }
      become: true
      tags: [ docker ]
