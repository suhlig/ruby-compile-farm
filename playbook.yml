- name: Deploy the ruby compile farm
  hosts: all
  tasks:
    - name: User exists
      ansible.builtin.user:
        name: suhlig
        comment: Steffen Uhlig
        shell: /usr/bin/zsh
        state: present
      tags: [ user, zsh ]
  roles:
    - role: suhlig.foundation.minimal
      become: true
      tags: [ suhlig ]
    - role: geerlingguy.docker
      vars: { docker_users: [ suhlig ] }
      become: true
      tags: [ docker ]
    - role: ruby_builder
      tags: [ ruby, build, container ]
