- name: Create temporary build directory
  tempfile:
    state: directory
    suffix: ruby-build
  register: build_dir
  tags: [ ruby, build, directory ]
- name: Copy Dockerfile to remote host
  copy:
    src: Dockerfile
    dest: "{{ build_dir.path }}/Dockerfile"
  tags: [ ruby, build, docker, copy ]
- name: Build Docker image
  community.docker.docker_image:
    build:
      path: "{{ build_dir.path }}"
      platform: linux/arm/v7
      args: { RUBY_VERSION: "{{ ruby_version }}" }
    name: ruby-builder
    source: build
  tags: [ ruby, build, docker, image ]
- name: Create temporary container
  community.docker.docker_container:
    name: ruby-extract
    image: ruby-builder
    state: started
    command: "true"
  tags: [ ruby, build, docker, container ]
- name: Copy archive from container to remote host
  command: docker cp ruby-extract:/ruby-{{ ruby_version }}-armhf-debian13.tar.gz /ruby-{{ ruby_version }}-armhf-debian13.tar.gz
  tags: [ ruby, build, docker, container, copy ]
- name: Fetch archive to controlling machine
  fetch:
    src: /ruby-{{ ruby_version }}-armhf-debian13.tar.gz
    dest: ./
    flat: yes
  tags: [ ruby, build, fetch, tarball, copy ]
- name: Remove archive from remote host
  file:
    path: /ruby-{{ ruby_version }}-armhf-debian13.tar.gz
    state: absent
  tags: [ ruby, build, cleanup ]
- name: Remove temporary container
  community.docker.docker_container:
    name: ruby-extract
    state: absent
  tags: [ ruby, build, docker, container, cleanup ]
- name: Remove temporary build directory
  file:
    path: "{{ build_dir.path }}"
    state: absent
  tags: [ ruby, build, cleanup ]
