- name: Build Docker image
  community.docker.docker_image:
    build:
      path: .
      platform: linux/arm/v7
    name: ruby-builder
    source: build
  tags: [ build ]
- name: Create temporary container
  community.docker.docker_container:
    name: ruby-extract
    image: ruby-builder
    state: started
    command: true
  tags: [ build ]
- name: Fetch archive to controlling machine
  fetch:
    src: /ruby-4.0.1-armhf-debian13.tar.gz
    dest: ./
    flat: yes
  tags: [ build ]
- name: Remove archive from remote host
  file:
    path: /ruby-4.0.1-armhf-debian13.tar.gz
    state: absent
  tags: [ build ]
- name: Remove temporary container
  community.docker.docker_container:
    name: ruby-extract
    state: absent
  tags: [ build ]
