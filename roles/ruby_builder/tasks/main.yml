- name: Temporary build directory exists
  ansible.builtin.tempfile:
    state: directory
    suffix: ruby-build
  register: build_dir
  tags: [ ruby, build, directory ]
- name: Dockerfile is available on the remote host
  ansible.builtin.copy:
    src: Dockerfile
    dest: "{{ build_dir.path }}/Dockerfile"
  tags: [ ruby, build, docker, copy ]
- name: Docker image is built
  community.docker.docker_image:
    build:
      path: "{{ build_dir.path }}"
      platform: "{{ docker_platform }}"
      args:
        RUBY_VERSION: "{{ ruby_version }}"
        DOCKER_PLATFORM: "{{ docker_platform }}"
        GNU_HOST: "{{ gnu_host }}"
        PLATFORM_LABEL: "{{ platform_label }}"
        BASE_IMAGE: "{{ base_image }}"
    name: ruby-builder
    source: build
  tags: [ ruby, build, docker, image ]
- name: Ruby is compiled and archived
  community.docker.docker_container:
    name: ruby-extract
    image: ruby-builder
    state: started
    command: "true"
  tags: [ ruby, build, docker, container ]
- name: Archive from container is available on the remote host
  ansible.builtin.command: docker cp ruby-extract:/ruby-{{ ruby_version }}-{{ platform_label }}.tar.gz /ruby-{{ ruby_version }}-{{ platform_label }}.tar.gz
  tags: [ ruby, build, docker, container, copy ]
- name: Archive is available on the controlling machine
  ansible.builtin.fetch:
    src: /ruby-{{ ruby_version }}-{{ platform_label }}.tar.gz
    dest: ./
    flat: yes
  tags: [ ruby, build, fetch, tarball, copy ]
- name: Archive is removed from remote host
  ansible.builtin.file:
    path: /ruby-{{ ruby_version }}-{{ platform_label }}.tar.gz
    state: absent
  tags: [ ruby, build, cleanup ]
- name: Temporary container is removed
  community.docker.docker_container:
    name: ruby-extract
    state: absent
  tags: [ ruby, build, docker, container, cleanup ]
- name: Temporary build directory is removed
  ansible.builtin.file:
    path: "{{ build_dir.path }}"
    state: absent
  tags: [ ruby, build, cleanup ]
